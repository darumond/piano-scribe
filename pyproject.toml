[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "piano-scribe"
version = "0.1.0"
description = "PianoScribe: an extensible automatic piano music transcription pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PianoScribe contributors" }]
dependencies = [
    "mido>=1.3,<2",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "cmake>=3.28",
    "mypy>=1.10",
    "ninja>=1.11",
    "pybind11>=2.12",
    "pytest>=8",
    "ruff>=0.5",
]
basic-pitch = ["basic-pitch>=0.4"]
pytorch = [
    "librosa>=0.10,<1",
    "piano-transcription-inference==0.0.6",
    "torch>=2.2,<3",
    "torchlibrosa>=0.1,<0.2",
]

[project.scripts]
piano-scribe = "piano_transcriber.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/editable/{wheel_tag}"
wheel.packages = ["python/piano_transcriber"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["piano_transcriber"]
mypy_path = "python"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mido", "soundfile", "scipy.*", "basic_pitch.*", "piano_transcription_inference.*"]
ignore_missing_imports = true
